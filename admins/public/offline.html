<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00337C" />
    <title>Offline | BYBS LMS</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f9fc;
        color: #111827;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 520px);
        padding: 32px 24px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #ffffff;
        text-align: center;
        box-shadow: 0 16px 40px rgba(16, 35, 63, 0.1);
      }
      img { width: 84px; height: 84px; object-fit: contain; }
      .eyebrow {
        margin: 20px 0 0;
        color: #00337c;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }
      h1 { margin: 10px 0 0; color: #10233f; font-size: 30px; line-height: 1.2; }
      p { margin: 14px auto 0; max-width: 420px; color: #374151; font-size: 15px; line-height: 1.7; }
      button {
        min-height: 44px;
        margin-top: 24px;
        padding: 10px 18px;
        border: 0;
        border-radius: 6px;
        background: #00337c;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #1e4b9e; }
      button:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }
      .note { color: #6b7280; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <img alt="Build Your Best Self" src="/icons/icon-192.png" />
      <p class="eyebrow">Build Your Best Self</p>
      <h1>You are offline</h1>
      <p>Your account data stays protected. Reconnect to load current assignments, messages, bookings, and progress.</p>
      <button data-retry type="button">Try again</button>
      <p class="note">This page will retry automatically when your connection returns.</p>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
